# ============================================================
# TBookStore API Gateway (Nginx)
#
# Cổng vào DUY NHẤT của hệ thống: client (Postman, frontend, mobile) chỉ gọi
# http://localhost:5080/..., còn FastAPI (service "api") không mở cổng ra ngoài —
# chỉ gateway nói chuyện được với nó qua Docker network.
#
#   Client ──► Gateway :5080 ──► /api/v1/*         → FastAPI api:8000
#                           ├──► /docs, /redoc,     → FastAPI (Swagger UI)
#                           │    /openapi.json
#                           ├──► /health, /health/db → FastAPI (health check)
#                           ├──► /gateway/health   → gateway tự trả lời
#                           └──► mọi đường dẫn khác → 404 (không lộ ra ngoài)
#
# Việc gateway làm (trước khi request tới FastAPI):
#   1. Định tuyến theo đường dẫn, chặn đường dẫn không public.
#   2. Rate limit theo IP (lớp thô: chống flood) — FastAPI vẫn giữ rate limit
#      nghiệp vụ 300 req/phút (RATE_LIMIT_PER_MINUTE) + login 10 lần/phút (lớp tinh, theo Redis).
#   3. Giới hạn kích thước body (10 MB — đủ cho file Excel import).
#   4. Gắn X-Request-ID cho mỗi request (trả về client + chuyển cho backend)
#      để tra log hai phía theo cùng 1 mã.
#   5. Chuyển IP thật của client cho backend (X-Forwarded-For / X-Real-IP).
#   6. Header bảo mật, ẩn version Nginx, nén gzip response JSON.
#   7. Access log dạng JSON (gateway/logs/access.log + `docker compose logs gateway`).
#   8. Lỗi do gateway sinh ra (404/413/429/502/504) đều trả JSON {"detail": ...}
#      giống format lỗi của FastAPI.
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    charset       utf-8;
    charset_types application/json text/plain;

    server_tokens off;              # không lộ version Nginx trong header/lỗi
    sendfile      on;
    keepalive_timeout 65;

    # Docker DNS nội bộ: phân giải lại "api" mỗi 10s, để gateway không giữ IP
    # cũ khi container api bị tạo lại (docker compose up --build...).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------- Request ID ----------------
    # Client gửi sẵn X-Request-ID thì dùng lại, không thì gateway tự sinh.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ---------------- Log ----------------
    log_format gateway_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$req_id",'
            '"client_ip":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log gateway_json;
    access_log /dev/stdout gateway_json;
    error_log  /var/log/nginx/error.log warn;

    # ---------------- Rate limit (theo IP) ----------------
    # api_per_ip: 50 req/s, cho phép dồn tối đa 100 request (burst) — đủ rộng
    #   cho Postman Collection Runner/CLI chạy liên tục, chỉ chặn flood.
    # login_per_ip: 30 lần/phút, burst 10 — chặn brute-force sớm ở cổng;
    #   FastAPI còn chặn chặt hơn (10 lần/phút) phía sau.
    limit_req_zone  $binary_remote_addr zone=api_per_ip:10m   rate=50r/s;
    limit_req_zone  $binary_remote_addr zone=login_per_ip:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---------------- Upstream: FastAPI ----------------
    upstream fastapi_backend {
        zone fastapi_backend 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # Header bảo mật + request id, gắn vào MỌI response (kể cả lỗi).
        add_header X-Request-ID           $req_id   always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy        "no-referrer" always;

        # Cấu hình proxy dùng chung cho mọi location proxy_pass bên dưới.
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Ghi đè (không nối thêm) để client không giả mạo được IP qua header này.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $req_id;
        # FastAPI cũng tự gắn các header bảo mật này -> ẩn bản của backend để
        # response không bị trùng header; gateway là nơi quản lý duy nhất.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Lỗi do gateway sinh ra -> JSON. Lỗi do FastAPI trả về (401, 409,
        # 429 nghiệp vụ, 503...) đi thẳng qua, không bị gateway sửa.
        error_page 404 = @not_found;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @backend_down;

        # ---- Gateway tự trả lời (không cần backend sống) ----
        location = /gateway/health {
            access_log off;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # ---- Đăng nhập: rate limit chặt hơn ----
        location = /api/v1/auth/login {
            limit_req  zone=login_per_ip burst=10 nodelay;
            limit_req  zone=api_per_ip   burst=100 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass http://fastapi_backend;
        }

        # ---- Toàn bộ API có version ----
        location /api/v1/ {
            limit_req  zone=api_per_ip burst=100 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass http://fastapi_backend;
        }

        # ---- Health check của backend (không rate limit, giống FastAPI) ----
        location = /health    { proxy_pass http://fastapi_backend; }
        location = /health/db { proxy_pass http://fastapi_backend; }

        # ---- Tài liệu API (Swagger UI / ReDoc / OpenAPI JSON) ----
        location = /docs                     { proxy_pass http://fastapi_backend; }
        location = /docs/oauth2-redirect     { proxy_pass http://fastapi_backend; }
        location = /redoc                    { proxy_pass http://fastapi_backend; }
        location = /openapi.json             { proxy_pass http://fastapi_backend; }

        # ---- Mọi đường dẫn khác: không public ----
        # Bao gồm đường dẫn cũ không prefix (/products, /orders...) mà FastAPI
        # vẫn giữ cho tương thích: ra ngoài chỉ mở bản /api/v1.
        location / {
            return 404;
        }

        # ---- Body lỗi JSON ----
        location @not_found {
            return 404 '{"detail":"Không tìm thấy đường dẫn trên API Gateway. Các API dùng tiền tố /api/v1/..."}';
        }
        location @too_large {
            return 413 '{"detail":"Dữ liệu gửi lên vượt quá 10 MB."}';
        }
        location @rate_limited {
            return 429 '{"detail":"Quá nhiều yêu cầu tới API Gateway, vui lòng thử lại sau."}';
        }
        location @backend_down {
            return 502 '{"detail":"API Gateway không kết nối được tới backend. Kiểm tra service api (docker compose ps)."}';
        }
    }
}
